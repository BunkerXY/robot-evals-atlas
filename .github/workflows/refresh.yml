name: Weekly refresh
on:
  schedule: [{cron: "0 7 * * 1"}]   # Mondays 07:00 UTC
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python scripts/fetch_stars.py && python scripts/build_readme.py
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - name: Commit refreshed data (direct to main; repo setting blocks Actions-created PRs)
        run: |
          if git diff --quiet; then echo "No changes"; exit 0; fi
          git config user.name "Bunker XY"
          git config user.email "founders@bunkerxy.com"
          git add data/stars.json data/atlas.csv README.md
          git commit -m "chore: weekly stars & license refresh"
          git push
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml && python scripts/watch_releases.py > digest.md
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
      - run: |
          if ! grep -q "_No new releases._" digest.md; then
            gh issue create --title "New releases to review ($(date -u +%F))" --body-file digest.md --label "release-watch" || \
            gh issue create --title "New releases to review ($(date -u +%F))" --body-file digest.md
          fi
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
