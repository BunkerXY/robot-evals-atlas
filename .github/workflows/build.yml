name: Build
on:
  push: {branches: [main]}
  pull_request:
jobs:
  validate-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - run: python scripts/validate.py
      - run: python scripts/build_readme.py
      - name: README must be regenerated from data/
        run: git diff --exit-code README.md data/atlas.csv || (echo "::error::Run python scripts/build_readme.py and commit the result"; exit 1)
